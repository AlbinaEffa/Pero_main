name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Отменяем устаревшие прогоны на той же ветке (экономия раннеров).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install deps (root)
        run: npm ci

      - name: Install deps (server)
        working-directory: server
        run: npm ci

      - name: Typecheck (client + server)
        run: npm run typecheck

      - name: Server unit tests (без БД)
        working-directory: server
        run: npm run test:unit

      - name: Client tests
        run: npm test

  # ── Интеграционные тесты (api/planLimits) бьют в реальную БД и пока НЕ в CI:
  # миграции не реплеятся с нуля в алфавитном порядке (0000-снапшот vs 0001_memory_tables —
  # chat_history без chapter_id, затем индекс по chapter_id падает). См. TECHDEBT «миграции».
  # Запускать локально: cd server && npm test (нужен DATABASE_URL + Postgres+pgvector).
